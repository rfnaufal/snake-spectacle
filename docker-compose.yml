services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: snake_user
      POSTGRES_PASSWORD: snake_password
      POSTGRES_DB: snake_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake_user -d snake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connect to the 'db' service
      DATABASE_URL: postgresql://snake_user:snake_password@db:5432/snake_db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
